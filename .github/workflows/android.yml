# Собирает приложение для Android.
#  • Всегда: APK для установки на телефон и проверки (Actions → запуск → Artifacts).
#  • Если добавлен ключ подписи: AAB для загрузки в Google Play.
#    Secrets: ANDROID_KEYSTORE_BASE64 (файл ключа в base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#    Variables: SITE_URL (адрес сайта, например https://example.com)
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["js/**", "css/**", "app.css", "index.html", "android/**", "capacitor.config.json", "package.json", "package-lock.json", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Собрать веб-часть и перенести в проект Android
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs && npx cap sync android
      - name: Версия
        run: |
          echo "KASSA_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "KASSA_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: APK для проверки
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kassa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Ключ подписи
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::notice::Ключ подписи не добавлен — собран только APK для проверки"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KASSA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: AAB для Google Play
        if: steps.key.outputs.ok == 'true'
        working-directory: android
        env:
          KASSA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KASSA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KASSA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: kassa-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

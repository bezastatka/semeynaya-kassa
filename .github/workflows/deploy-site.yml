# Выкладывает сайт на ваш хостинг по FTP после каждого изменения в ветке main.
# Нужно один раз добавить в репозитории: Settings → Secrets and variables → Actions
#   Secrets:   FTP_SERVER (адрес FTP-сервера), FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_DIR  (папка сайта на хостинге, например public_html/ — обязательно со слешем в конце)
#              SITE_URL (адрес сайта, например https://example.com)
#              FTP_PROTOCOL (необязательно: ftps по умолчанию; ftp — если хостинг не поддерживает шифрование)
name: Выложить сайт
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить настройки FTP
        id: chk
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then echo "::notice::FTP ещё не настроен — сайт не выкладывается"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Собрать сайт
        if: steps.chk.outputs.ok == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs
      - name: Выложить по FTP
        if: steps.chk.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
